name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Kept minimal and separate from the voice assistant's full
          # requirements.txt on purpose: several of those packages
          # (pyttsx3, sounddevice, soundfile) need system audio libs that
          # ubuntu-latest doesn't have out of the box and would make CI
          # flaky/slow for something orchestrator/ doesn't even use.
          # Add here only what orchestrator/ actually imports.
          pip install pytest pytest-mock requests
      - name: Run tests
        run: pytest
